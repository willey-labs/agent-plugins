<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capability map</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf8; --panel: #ffffff; --ink: #191714; --dim: #6c665e; --line: #e4e0da;
    --chip: #f3f1ed; --chip-line: #e1ddd6; --accent: #1f5fbf; --accent-bg: #eaf1fc;
    --done: #2f7a4f; --done-bg: #e8f4ec; --warn: #9a5b00; --warn-bg: #fff4e5; --warn-line: #ffd9b8;
    --cap: #f6f4f0; --mark: #191714;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141312; --panel: #1b1a18; --ink: #efece8; --dim: #a29c93; --line: #2f2c29;
      --chip: #23211f; --chip-line: #34312d; --accent: #7fb0ff; --accent-bg: #1b2a40;
      --done: #7fcf9f; --done-bg: #17291f; --warn: #ffc98a; --warn-bg: #2e2415; --warn-line: #4a3a1f;
      --cap: #1f1d1b; --mark: #efece8;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 18px 16px 8px; max-width: 1100px; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .lede { color: var(--dim); margin: 0 0 10px; }
  .notice { margin: 0 16px 10px; padding: 8px 12px; border-radius: 8px; max-width: 1100px;
    background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-line); }
  .notice ul { margin: 4px 0 0; padding-left: 18px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--dim); font-size: 12px; align-items: center; }
  .legend span, .legend label { display: inline-flex; gap: 6px; align-items: center; }
  .swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--chip-line); background: var(--chip); }
  .swatch.support { border-style: dashed; background: transparent; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mark); }
  .scroller { overflow-x: auto; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  table.grid { border-collapse: separate; border-spacing: 0; min-width: 100%; }
  .grid th, .grid td { vertical-align: top; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
  .grid thead th { position: sticky; top: 0; background: var(--panel); z-index: 2; text-align: left;
    padding: 8px; min-width: 150px; cursor: pointer; font-weight: 400; }
  .grid thead th.lead { left: 0; z-index: 3; min-width: 220px; cursor: default; font-weight: 600; }
  .grid thead th[aria-pressed="true"] { box-shadow: inset 0 -3px 0 var(--accent); }
  .mid { font-weight: 650; font-variant-numeric: tabular-nums; }
  .mname { display: block; margin: 2px 0 0; }
  .status { font-size: 11px; padding: 1px 6px; border-radius: 99px; color: var(--dim); background: var(--chip); }
  .status.done { color: var(--done); background: var(--done-bg); }
  .status.current { color: var(--warn); background: var(--warn-bg); }
  td.lead { position: sticky; left: 0; background: var(--panel); z-index: 1; padding: 8px; }
  tr.cap td, tr.cap td.lead { background: var(--cap); padding: 8px; }
  .cid, .fid, .chip b { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cid { font-weight: 650; margin-right: 6px; }
  .cname { font-weight: 600; }
  .sub { display: block; color: var(--dim); font-size: 11.5px; }
  .fid { color: var(--dim); margin-right: 4px; }
  .main { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--dim); }
  td.cell { padding: 6px; }
  td.cell.sel { background: var(--accent-bg); }
  .chip { display: block; padding: 5px 7px; margin: 0 0 5px; border-radius: 7px; background: var(--chip);
    border: 1px solid var(--chip-line); font-size: 12px; line-height: 1.35; }
  .chip.support { background: transparent; border-style: dashed; }
  .chip b { font-weight: 600; margin-right: 4px; }
  .chip .step { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }
  body.compact .chip .nm, body.compact .chip .step { display: none; }
  body.compact .chip { display: inline-block; margin: 0 4px 4px 0; padding: 2px 6px; }
  body.compact .grid thead th { min-width: 110px; }
  section.detail { max-width: 1100px; padding: 16px; }
  .detail h2 { font-size: 17px; margin: 0 0 4px; }
  .detail .meta { color: var(--dim); margin: 0 0 8px; }
  .detail h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); margin: 16px 0 6px; }
  .detail p { margin: 0; }
  .detail ol { margin: 0; padding-left: 20px; }
  .detail li { margin: 3px 0; }
  .features { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .features table { width: 100%; border-collapse: collapse; }
  .features th, .features td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line); }
  .features th { color: var(--dim); font-weight: 500; font-size: 12px; }
  .features tr:last-child td { border-bottom: 0; }
  .empty { padding: 24px 16px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Capability map</h1>
  <p class="lede" id="lede"></p>
  <div class="legend">
    <span><i class="dot"></i> the milestone's main capability</span>
    <span><i class="swatch"></i> sub-feature of the main capability</span>
    <span><i class="swatch support"></i> sub-feature of another capability, needed by an exit-check step</span>
    <label><input type="checkbox" id="compact"> Ids only</label>
  </div>
</header>
<div id="notices"></div>
<div class="scroller"><table class="grid" id="grid"></table></div>
<section class="detail" id="detail"></section>
<script>
  var state = { data: null, selected: null };
  var LATER = { id: 'later', name: 'Not planned yet', status: 'later', capability: null, page: null };

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (key) {
      if (key === 'text') node.textContent = attrs[key];
      else if (key === 'class') node.className = attrs[key];
      else node.setAttribute(key, attrs[key]);
    });
    (children || []).forEach(function (child) { if (child) node.appendChild(child); });
    return node;
  }

  function columns() {
    var hasLater = state.data.capabilities.some(function (c) {
      return c.features.some(function (f) { return f.subs.some(function (s) { return s.milestone === 'later'; }); });
    });
    return state.data.milestones.concat(hasLater ? [LATER] : []);
  }

  function milestone(id) {
    return columns().filter(function (m) { return m.id === id; })[0];
  }

  function exitStepOf(m, subId) {
    var row = m.page && m.page.subs ? m.page.subs.filter(function (s) { return s.id === subId; })[0] : null;
    return row ? row.exitStep : null;
  }

  function cellFor(m) {
    return el('td', { class: 'cell' + (m.id === state.selected ? ' sel' : '') });
  }

  function headRow() {
    var row = el('tr', {}, [el('th', { class: 'lead', text: 'Capability · feature' })]);
    columns().forEach(function (m) {
      var th = el('th', { 'aria-pressed': String(m.id === state.selected) }, [
        m.id === 'later' ? null : el('span', { class: 'mid', text: m.id + ' ' }),
        el('span', { class: 'status ' + m.status, text: m.status === 'later' ? 'later' : m.status }),
        el('span', { class: 'mname', text: m.name }),
      ]);
      th.addEventListener('click', function () { select(m.id); });
      row.appendChild(th);
    });
    return el('thead', {}, [row]);
  }

  function capabilityRow(capability) {
    var row = el('tr', { class: 'cap' }, [el('td', { class: 'lead' }, [
      el('span', { class: 'cid', text: capability.id }),
      el('span', { class: 'cname', text: capability.name }),
      el('span', { class: 'sub', text: capability.serves }),
    ])]);
    columns().forEach(function (m) {
      var cell = cellFor(m);
      if (m.capability === capability.id) {
        cell.appendChild(el('span', { class: 'main' }, [el('i', { class: 'dot' }), document.createTextNode('main')]));
      }
      row.appendChild(cell);
    });
    return row;
  }

  function chip(sub, capability, m) {
    var supporting = Boolean(m.capability) && m.capability !== capability.id;
    var step = exitStepOf(m, sub.id);
    return el('span', { class: 'chip' + (supporting ? ' support' : ''), title: sub.name }, [
      el('b', { text: sub.id }),
      el('span', { class: 'nm', text: sub.name }),
      supporting ? el('span', { class: 'step', text: step ? 'for exit step ' + step : 'no exit step named' }) : null,
    ]);
  }

  function featureRow(feature, capability) {
    var row = el('tr', {}, [el('td', { class: 'lead' }, [
      el('span', { class: 'fid', text: feature.id }),
      document.createTextNode(feature.name),
      el('span', { class: 'sub', text: feature.kind }),
    ])]);
    columns().forEach(function (m) {
      var cell = cellFor(m);
      feature.subs.filter(function (s) { return s.milestone === m.id; })
        .forEach(function (s) { cell.appendChild(chip(s, capability, m)); });
      row.appendChild(cell);
    });
    return row;
  }

  function renderGrid() {
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    grid.appendChild(headRow());
    var body = el('tbody');
    state.data.capabilities.forEach(function (capability) {
      body.appendChild(capabilityRow(capability));
      capability.features.forEach(function (feature) { body.appendChild(featureRow(feature, capability)); });
    });
    grid.appendChild(body);
  }

  function featuresTable(page) {
    var head = el('tr', {}, ['id', 'feature', 'capability', 'decision', 'build'].map(function (h) {
      return el('th', { text: h });
    }));
    var rows = page.features.map(function (f) {
      return el('tr', {}, [f.id, f.name, f.capability, f.decision, f.build].map(function (value) {
        return el('td', { text: value || '—' });
      }));
    });
    return el('div', { class: 'features' }, [el('table', {}, [el('thead', {}, [head]), el('tbody', {}, rows)])]);
  }

  function capabilityName(id) {
    var found = state.data.capabilities.filter(function (c) { return c.id === id; })[0];
    return found ? found.id + ' ' + found.name : id;
  }

  function renderDetail() {
    var m = milestone(state.selected);
    var detail = document.getElementById('detail');
    detail.innerHTML = '';
    if (!m) return;
    if (m.id === 'later') {
      detail.appendChild(el('h2', { text: 'Not planned yet' }));
      detail.appendChild(el('p', { class: 'meta', text: 'Sub-features no milestone takes yet.' }));
      return;
    }
    detail.appendChild(el('h2', { text: m.id + ' ' + m.name }));
    var meta = (m.capability ? 'Main capability ' + capabilityName(m.capability) + ' · ' : '') + m.status;
    detail.appendChild(el('p', { class: 'meta', text: meta }));
    if (!m.page) {
      detail.appendChild(el('p', { text: 'Its goal, exit check and features are written when the milestone opens.' }));
      return;
    }
    [['Goal', m.page.goal], ['Excludes', m.page.excludes]].forEach(function (pair) {
      detail.appendChild(el('h3', { text: pair[0] }));
      detail.appendChild(el('p', { text: pair[1] || '—' }));
    });
    detail.appendChild(el('h3', { text: 'Exit check' }));
    detail.appendChild(el('ol', {}, m.page.exit.map(function (step) { return el('li', { text: step }); })));
    detail.appendChild(el('h3', { text: 'Features' }));
    detail.appendChild(featuresTable(m.page));
  }

  function renderNotices() {
    var box = document.getElementById('notices');
    box.innerHTML = '';
    if (state.data.status === 'proposed') {
      box.appendChild(el('div', { class: 'notice', text: 'This map is proposed. Tell the agent to confirm it, or what to change.' }));
    }
    if (state.data.problems.length) {
      box.appendChild(el('div', { class: 'notice' }, [
        document.createTextNode('The map breaks ' + state.data.problems.length + ' of its rules:'),
        el('ul', {}, state.data.problems.map(function (p) { return el('li', { text: p }); })),
      ]));
    }
  }

  function select(id) {
    state.selected = id;
    renderGrid();
    renderDetail();
  }

  function firstSelection(data) {
    var open = data.milestones.filter(function (m) { return m.status === 'current'; })[0] ||
      data.milestones.filter(function (m) { return m.status !== 'done'; })[0] || data.milestones[0];
    return open ? open.id : 'later';
  }

  document.getElementById('compact').addEventListener('change', function (event) {
    document.body.classList.toggle('compact', event.target.checked);
  });

  fetch('map.json', { cache: 'no-store' })
    .then(function (reply) { return reply.json(); })
    .then(function (data) {
      if (!data.exists) {
        document.body.innerHTML = '<p class="empty">No capability map yet. Running /next writes one.</p>';
        return;
      }
      state.data = data;
      var parts = [data.line, data.actors ? 'Actors: ' + data.actors + '.' : ''].filter(Boolean);
      document.getElementById('lede').textContent = parts.join(' ');
      renderNotices();
      select(firstSelection(data));
    })
    .catch(function (failure) {
      document.getElementById('detail').textContent = 'The map did not load: ' + failure.message;
    });
</script>
</body>
</html>
